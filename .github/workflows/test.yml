name: Test remote examples
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r clients/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/smoke_remote.py
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: docker compose config --quiet
        env:
          MCP_AUTH_TOKEN: ci-example-token-not-a-real-secret-123456
      - run: docker build -t mcp-server-examples:local .
      - run: python scripts/smoke_containers.py
