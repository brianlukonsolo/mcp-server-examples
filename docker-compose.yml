# Every example shares one image. Each service has a distinct URL and database volume.
x-server: &server
  image: mcp-server-examples:local
  build: .
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp:size=32m,mode=1777]
  mem_limit: 256m
  pids_limit: 100
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'
x-environment: &environment
  HOST: 0.0.0.0
  ENVIRONMENT: production
  MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?set MCP_AUTH_TOKEN in .env (32+ random characters)}
  MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
  RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
  MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-1048576}
  DATA_DIR: /app/data
services:
  hello-world:
    <<: *server
    command: [python, 01-hello-world/server.py]
    environment:
      <<: *environment
      PORT: '8101'
    ports: ["127.0.0.1:8101:8101"]
  remote-basic:
    <<: *server
    command: [python, 02-remote-basic/server.py]
    environment:
      <<: *environment
      PORT: '8102'
    ports: ["127.0.0.1:8102:8102"]
  remote-auth:
    <<: *server
    command: [python, 03-remote-auth/server.py]
    environment:
      <<: *environment
      PORT: '8103'
    ports: ["127.0.0.1:8103:8103"]
  tool-features:
    <<: *server
    command: [python, 04-tool-features/server.py]
    environment:
      <<: *environment
      PORT: '8104'
    ports: ["127.0.0.1:8104:8104"]
  task-manager:
    <<: *server
    command: [python, 05-task-manager/server.py]
    environment:
      <<: *environment
      PORT: '8105'
      TASKS_DB: /app/data/tasks.db
    ports: ["127.0.0.1:8105:8105"]
    volumes: [task-manager-data:/app/data]
  secure-gateway:
    <<: *server
    command: [python, 06-secure-gateway/server.py]
    environment:
      <<: *environment
      PORT: '8106'
    ports: ["127.0.0.1:8106:8106"]
  knowledge-base:
    <<: *server
    command: [python, 07-knowledge-base/server.py]
    environment:
      <<: *environment
      PORT: '8107'
    ports: ["127.0.0.1:8107:8107"]
    volumes: [knowledge-base-data:/app/data]
  workflow-engine:
    <<: *server
    command: [python, 08-workflow-engine/server.py]
    environment:
      <<: *environment
      PORT: '8108'
    ports: ["127.0.0.1:8108:8108"]
    volumes: [workflow-engine-data:/app/data]
  inventory-reservations:
    <<: *server
    command: [python, 09-inventory-reservations/server.py]
    environment:
      <<: *environment
      PORT: '8109'
    ports: ["127.0.0.1:8109:8109"]
    volumes: [inventory-reservations-data:/app/data]
volumes:
  task-manager-data:
  knowledge-base-data:
  workflow-engine-data:
  inventory-reservations-data:
